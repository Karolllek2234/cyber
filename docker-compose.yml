version: "3.8"

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24

services:
  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    networks:
      - lab
    ports:
      - "3000:3000"

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    networks:
      lab:
        ipv4_address: 10.10.0.10
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./logs:/var/log/nginx
    depends_on:
      - juice-shop

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: elasticsearch
    networks:
      - lab
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: kibana
    networks:
      - lab
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.1
    container_name: filebeat
    user: root
    networks:
      - lab
    command: filebeat -e --strict.perms=false
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml
      - ./logs:/var/log/nginx
    depends_on:
      - elasticsearch

  # OWASP ZAP attackers on the lab network; scans to http://nginx appear under each
  # container IP in nginx logs (10.10.0.101 / 10.10.0.102).
  #
  # Trigger from the host (wait ~60s after startup for ZAP to finish booting):
  #   curl "http://localhost:8081/JSON/spider/action/scan/?url=http://nginx/"
  #   curl "http://localhost:8081/JSON/ascan/action/scan/?url=http://nginx/"
  #   curl "http://localhost:8082/JSON/spider/action/scan/?url=http://nginx/"
  attacker-a:
    image: zaproxy/zap-stable
    container_name: attacker-a
    networks:
      lab:
        ipv4_address: 10.10.0.101
    ports:
      - "8081:8080"
    volumes:
      - ./zap-reports/attacker-a:/zap/wrk:rw
    depends_on:
      - nginx
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config api.disablekey=true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/JSON/core/view/version/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  attacker-b:
    image: zaproxy/zap-stable
    container_name: attacker-b
    networks:
      lab:
        ipv4_address: 10.10.0.102
    ports:
      - "8082:8080"
    volumes:
      - ./zap-reports/attacker-b:/zap/wrk:rw
    depends_on:
      - nginx
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config api.disablekey=true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/JSON/core/view/version/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
