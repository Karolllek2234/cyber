filebeat.inputs:
  - type: filestream
    id: nginx-access
    enabled: true
    paths:
      - /var/log/nginx/access.log

setup.template.enabled: false
setup.ilm.enabled: false

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "nginx-lab-%{+yyyy.MM.dd}"
  pipeline: "nginx-lab"

setup.kibana:
  host: "http://kibana:5601"
